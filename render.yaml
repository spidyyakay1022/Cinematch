services:
  - type: web
    name: cinematch-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt -r ai_engine/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_ORIGIN
        value: https://cinematch-ai-preview.vercel.app
